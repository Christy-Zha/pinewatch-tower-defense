<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#182720"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="game.webmanifest"><link rel="apple-touch-icon" href="assets/watch-icon.png"><title>松境守卫 · 晨钟纪事</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="phone.css?v=freebuild1"></head>
<body><header class="topbar"><div class="navwrap">
  <div class="brand"><canvas id="emblem" width="30" height="32" aria-hidden="true"></canvas><div><strong>松境守卫</strong><small>PINEWATCH</small></div></div>
  <nav class="nav-actions"><button class="navbtn active" id="battle-nav"><i data-icon="flag"></i><span>战场</span></button><button class="navbtn" id="models-btn"><i data-icon="cube"></i><span>角色图鉴</span></button><button class="navbtn" id="chapters-btn"><i data-icon="book"></i><span>战役纪事</span></button><button class="navbtn" id="shop-btn"><i data-icon="shop"></i><span>渡鸦商店</span></button></nav>
  <div class="utilities"><button id="sound" class="sq" title="点击启用声音" aria-label="点击启用声音" aria-pressed="false"><i data-icon="mute"></i></button><button id="help" class="sq" title="游戏指南" aria-label="游戏指南"><i data-icon="help"></i></button></div>
</div></header>
<main><div id="battle-shell" data-dock="armory"><section class="overview"><div class="heading"><div class="eyebrow"><span class="diamond"></span>晨钟纪事 <b>/</b> <span id="chapter-count"></span></div><h1 id="chapter-title"></h1><p id="mission"></p></div>
  <div class="hud"><div class="metric"><i data-icon="heart"></i><div><small>城门生命</small><strong id="health">20</strong><em> / 20</em></div></div><div class="metric"><i data-icon="coin"></i><div><small>建造军费</small><strong id="gold"></strong></div></div><div class="metric"><i data-icon="flag"></i><div><small>守城波次</small><strong id="wave">0</strong><em id="wave-max"></em></div></div></div></section>
  <div class="layout"><section class="board panel"><div class="panel-head"><div class="section-title"><i data-icon="map"></i><h2>战场沙盘</h2><small>BATTLEFIELD</small></div><div class="board-actions"><button id="battle-menu" type="button" aria-haspopup="dialog"><span aria-hidden="true">☰</span> 菜单</button><span class="phase"><b></b><span id="phase">整备阶段</span></span><button id="battle-expand" type="button" aria-controls="battle-shell" aria-pressed="false" title="进入全屏战场"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7V3h4m6 0h4v4m0 6v4h-4m-6 0H3v-4"/></svg><span>全屏</span></button></div></div>
  <div class="map-frame"><div id="map-area" class="map-area"><div class="scene-watermark" aria-hidden="true"></div><canvas id="field" aria-label="可旋转、缩放的三维战场"></canvas><div id="pad-controls" aria-label="防御塔基座与战地物资"></div><div class="scene-meta"><span class="location"><i data-icon="pin"></i><span id="region"></span></span><button id="supply-orders" type="button" title="战地物资与清障指令">物资 0 / 2</button></div><div class="camera-bar" role="group" aria-label="战场视角"><button id="cam-left" title="向左旋转视角" aria-label="向左旋转视角">↶</button><button id="cam-right" title="向右旋转视角" aria-label="向右旋转视角">↷</button><button id="cam-zoom-out" type="button" title="缩小战场" aria-label="缩小战场">−</button><button id="cam-zoom-in" type="button" title="放大战场" aria-label="放大战场">＋</button><button id="cam-home" title="恢复全图与初始视角" aria-label="恢复全图与初始视角"><i data-icon="cube"></i></button></div><div id="map-msg" role="status"></div><div class="paused-overlay" hidden><span>战斗已暂停</span></div></div></div>
  <div class="controls"><button class="primary" id="start"><i data-icon="play"></i><span></span></button><span class="combat-progress" id="combat-progress"></span><div class="play-controls"><button class="secondary" id="speed" title="切换速度（X）"><i data-icon="speed"></i><span>1×</span></button><button class="secondary" id="pause" title="暂停 / 继续（空格）"><i data-icon="pause"></i><span>暂停</span></button><button class="secondary" id="restart" title="重新开始本关" aria-label="重新开始本关"><i data-icon="restart"></i><span>本局重来</span></button></div></div>
  </section><aside><div class="dock-tabs" role="group" aria-label="战场指令"><button type="button" data-dock-tab="armory" aria-controls="battle-armory" aria-pressed="true"><i data-icon="hammer"></i>建造工坊</button><button type="button" data-dock-tab="cards" aria-controls="battle-hand" aria-pressed="false"><i data-icon="cards"></i>战术手牌</button><button class="phone-intel-tab" type="button" data-dock-tab="intel" aria-controls="battle-intel" aria-pressed="false"><i data-icon="scope"></i>敌情</button></div><section class="ranger-card panel"><canvas id="ranger-preview" aria-label="阿遥的立体角色特写"></canvas><div class="ranger-card-copy"><small>驻守英雄</small><h2>阿遥</h2><p>松林巡弓手</p><button id="inspect-ranger" class="textbtn">查看模型 ↗</button></div></section><section class="panel armory" id="battle-armory"><div class="panel-head"><div class="section-title"><i data-icon="hammer"></i><h2>建造工坊</h2><small>ARMORY</small></div></div>
    <div class="armory-content" id="armory-content"><div class="tower-list" id="tower-list"></div><p class="build-hint"><i data-icon="cursor"></i><span>点路旁空地建塔，点树木或石块清障。</span></p></div><div class="manage" id="manage" hidden></div></section>
    <section class="panel cards-panel" id="battle-hand"><div class="intel-head"><div class="section-title"><i data-icon="cards"></i><h2>战术手牌</h2></div><button id="cards-store" class="textbtn">补给 ↗</button></div><div class="hand" id="hand"></div></section>
    <section class="panel intel" id="battle-intel"><div class="intel-head"><div class="section-title"><i data-icon="scope"></i><h2>敌情预报</h2></div><span id="intel-wave"></span></div><div id="intel-body"></div></section></aside></div></div>
  <section class="journal-strip"><div class="journal-icon"><i data-icon="quill"></i></div><div><div class="eyebrow" id="story-label"></div><h2 id="story-title"></h2><p id="story"></p></div><button class="quiet" id="read-journal">查看纪事 →</button></section>
  <footer><div><kbd>拖动</kbd><span>旋转沙盘</span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><span>选塔</span><kbd>空格</kbd><span>暂停</span><kbd>X</kbd><span>变速</span></div></footer>
</main>
<dialog id="dialog"><div class="dialog-head"><div class="eyebrow" id="dialog-label"></div><button id="close" class="close" aria-label="关闭">×</button></div><h2 id="dialog-title"></h2><div id="dialog-body"></div><div id="dialog-actions"></div></dialog>
<script src="sprites.js"></script><script src="campaign.js"></script><script src="engine.js?v=freebuild1"></script><script src="progress.js?v=freebuild1"></script><script src="scenery.js?v=freebuild1"></script><script src="figures.js?v=freebuild1"></script><script src="visage.js"></script><script src="ranger.js"></script><script src="invaders.js"></script><script src="renderer.js?v=freebuild1"></script><script src="studio.js?v=freebuild1"></script><script src="sound.js?v=freebuild1"></script><script src="ui.js?v=freebuild1"></script><script src="battlefield.js?v=freebuild1"></script></body></html>
